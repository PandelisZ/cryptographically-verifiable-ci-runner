[package]
name = "vci-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
jiff = "0.2.37"
mimalloc = "0.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.6"
vci-adapter = { version = "2.0.0", path = "../vci-adapter" }
vci-attest = { version = "2.0.0", path = "../vci-attest" }
vci-core = { version = "2.0.0", path = "../vci-core" }
vci-git = { version = "2.0.0", path = "../vci-git" }
vci-store = { version = "2.0.0", path = "../vci-store" }
vci-store-libsql = { version = "2.0.0", path = "../vci-store-libsql", optional = true }
vci-store-postgres = { version = "2.0.0", path = "../vci-store-postgres", optional = true }
vci-store-sqlite = { version = "2.0.0", path = "../vci-store-sqlite", optional = true }

[features]
default = ["sqlite", "postgres", "libsql"]
# The attestation store backends this vci is built with (git-meta always).
sqlite = ["dep:vci-store-sqlite"]
postgres = ["dep:vci-store-postgres"]
libsql = ["dep:vci-store-libsql"]

[[bin]]
name = "vci"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
git-meta-lib = { version = "=0.1.13", features = ["internal"] }
predicates = "3.1.4"
tempfile = "3.27.0"
# The four-backend parity suite (tests/store_parity.rs) ages objects behind
# each store's back with SQL on its SQLite and git-meta files.
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
# The format-3 fixtures of the conformance suite (`Run3`), for the parity
# suite and the 2.8 binary test of tests/store_backends.rs.
vci-store = { version = "2.0.0", path = "../vci-store", features = ["conformance"] }
# Step D's CLI tests start PostgreSQL through its testkit, also in a build
# without the `postgres` feature; the libSQL tests start sqld through its;
# the parity suite opens SQLite files through its store.
vci-store-libsql = { version = "2.0.0", path = "../vci-store-libsql" }
vci-store-postgres = { version = "2.0.0", path = "../vci-store-postgres" }
vci-store-sqlite = { version = "2.0.0", path = "../vci-store-sqlite" }
