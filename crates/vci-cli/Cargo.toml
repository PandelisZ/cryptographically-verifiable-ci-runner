[package]
name = "vci-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
jiff = "0.2.37"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.6"
vci-adapter = { version = "0.1.0", path = "../vci-adapter" }
vci-attest = { version = "0.1.0", path = "../vci-attest" }
vci-core = { version = "0.1.0", path = "../vci-core" }
vci-git = { version = "0.1.0", path = "../vci-git" }

[[bin]]
name = "vci"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
