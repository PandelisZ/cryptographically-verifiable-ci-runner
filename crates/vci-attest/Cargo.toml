[package]
name = "vci-attest"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
camino = "1.2.6"
der = { version = "0.7.10", features = ["std", "oid"] }
jiff = "0.2.37"
p256 = { version = "0.13.2", features = ["ecdsa", "pem"] }
p384 = { version = "0.13.1", features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssh-key = { version = "0.6", features = ["crypto", "std", "alloc"] }
thiserror = "2.0.21"
toml = "1.1.6"
vci-core = { version = "2.0.0", path = "../vci-core" }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
