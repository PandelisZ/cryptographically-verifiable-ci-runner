[package]
name = "vci-store-libsql"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Exactly 0.10.0 (published 13 Oct 2026, twelve days before it was pinned:
# the version this store was specified against) with `remote` only: the
# Hrana-over-HTTP client, in Rust.
# Its `core` feature bundles libSQL's own SQLite, whose `sqlite3_*` symbols
# collide with the SQLite rusqlite bundles for git-meta and the SQLite
# backend (one copy wins at link time, and libSQL's start-up check then
# panics). Its `tls` feature would bring hyper-rustls 0.25 and a second
# rustls: vci hands it a connector on the workspace's rustls with the
# `ring` provider instead (`cargo tree -i aws-lc-rs` stays empty).
http = "0.2"
hyper = { version = "0.14", default-features = false, features = ["client", "http1", "tcp"] }
libsql = { version = "=0.10.0", default-features = false, features = ["remote"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
tokio = { version = "1.54.1", features = ["rt", "time", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3"
vci-core = { version = "2.0.0", path = "../vci-core" }
vci-store = { version = "2.0.0", path = "../vci-store" }
vci-store-sqlite = { version = "2.0.0", path = "../vci-store-sqlite" }
webpki-roots = "=1.0.9"
# Values stored compressed (encoding 1, `VCI_STORE_COMPRESS=zstd`): the
# reference C library (bundled, built with the C compiler the bundled
# SQLite already needs), no optional features.
zstd = { version = "=0.13.3", default-features = false }

[dev-dependencies]
base64 = "0.23.1"
ed25519-dalek = "2.2.0"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
tempfile = "3.27.0"
zstd = { version = "=0.13.3", default-features = false }
vci-store = { version = "2.0.0", path = "../vci-store", features = ["conformance"] }
