[package]
name = "vci-store-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Exactly git-meta-lib's version: libsqlite3-sys declares `links = "sqlite3"`, so only one copy can link.
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
serde_json = "1.0.151"
vci-core = { version = "2.0.0", path = "../vci-core" }
vci-store = { version = "2.0.0", path = "../vci-store" }

[dev-dependencies]
tempfile = "3.27.0"
vci-store = { version = "2.0.0", path = "../vci-store", features = ["conformance"] }
