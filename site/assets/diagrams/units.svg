<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 756 278" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" role="img" aria-label="What counts as a skippable unit for each supported test runner"><style>.t{fill:#1b1d1a}.m{fill:#5d635b}.a{fill:#15803d}.w{fill:#b45309}.box{fill:#ffffff;stroke:#e1e2dc;stroke-width:1.3}.boxa{fill:#e3f3e7;stroke:#15803d;stroke-width:1.3}.boxw{fill:#fdf0dc;stroke:#b45309;stroke-width:1.3}.boxg{fill:#f2f2ee;stroke:#e1e2dc;stroke-width:1.2}.ln{stroke:#9aa298;stroke-width:1.5;fill:none}.lna{stroke:#15803d;stroke-width:1.8;fill:none}.lnw{stroke:#b45309;stroke-width:1.8;fill:none}.dash{stroke-dasharray:5 4}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-color-scheme:dark){.t{fill:#e6e9e4}.m{fill:#9aa298}.a{fill:#4ade80}.w{fill:#fbbf63}.box{fill:#151918;stroke:#262b29}.boxa{fill:#12281a;stroke:#4ade80}.boxw{fill:#2b2010;stroke:#fbbf63}.boxg{fill:#0a0c0b;stroke:#262b29}.ln{stroke:#5d635b}.lna{stroke:#4ade80}.lnw{stroke:#fbbf63}}.bg{fill:#fbfbf9}@media(prefers-color-scheme:dark){.bg{fill:#0e1110}}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa298"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><rect class="bg" x="-8" y="-8" width="756" height="278" rx="12"/><text class="t" x="0" y="18" font-size="16" font-weight="650">The unit that can be skipped, per runner</text><rect class="box" x="0" y="40" width="236" height="80" rx="10"/><text class="t" x="14" y="64" font-weight="650">Vitest</text><text class="a" x="14" y="84" font-size="12.5" font-weight="600">test file</text><text class="mono m" x="14" y="106" font-size="12">src/cart.test.ts</text><rect class="box" x="250" y="40" width="236" height="80" rx="10"/><text class="t" x="264" y="64" font-weight="650">pytest</text><text class="a" x="264" y="84" font-size="12.5" font-weight="600">test file</text><text class="mono m" x="264" y="106" font-size="12">tests/test_orders.py</text><rect class="box" x="500" y="40" width="236" height="80" rx="10"/><text class="t" x="514" y="64" font-weight="650">Go</text><text class="a" x="514" y="84" font-size="12.5" font-weight="600">package</text><text class="mono m" x="514" y="106" font-size="12">./pricing</text><rect class="box" x="0" y="136" width="236" height="80" rx="10"/><text class="t" x="14" y="160" font-weight="650">Cargo</text><text class="a" x="14" y="180" font-size="12.5" font-weight="600">test target</text><text class="mono m" x="14" y="202" font-size="12">crates/api#test:orders</text><rect class="box" x="250" y="136" width="236" height="80" rx="10"/><text class="t" x="264" y="160" font-weight="650">Rails</text><text class="a" x="264" y="180" font-size="12.5" font-weight="600">Minitest file</text><text class="mono m" x="264" y="202" font-size="12">test/models/order_test.rb</text><rect class="box" x="500" y="136" width="236" height="80" rx="10"/><text class="t" x="514" y="160" font-weight="650">RSpec</text><text class="a" x="514" y="180" font-size="12.5" font-weight="600">spec file</text><text class="mono m" x="514" y="202" font-size="12">spec/models/order_spec.rb</text><text class="m" x="0" y="248" font-size="12.5">Each unit runs on its own (a process, or an isolated worker for Vitest), so inputs cannot leak between units.</text></svg>