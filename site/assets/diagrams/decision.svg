<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 776 486" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" role="img" aria-label="The five checks a unit must pass to be skipped; any failed check means it runs">
<style>.bg{fill:#fbfbf9}.t{fill:#1b1d1a}.m{fill:#5d635b}.a{fill:#15803d}.w{fill:#b45309}.box{fill:#ffffff;stroke:#e1e2dc;stroke-width:1.3}.boxa{fill:#e3f3e7;stroke:#15803d;stroke-width:1.4}.rail{fill:#fdf0dc;stroke:#b45309;stroke-width:1.4}.lna{stroke:#15803d;stroke-width:1.8;fill:none}.lnw{stroke:#b45309;stroke-width:1.8;fill:none}.num{fill:#e3f3e7}.numt{fill:#15803d;font-weight:700}@media(prefers-color-scheme:dark){.bg{fill:#0e1110}.t{fill:#e6e9e4}.m{fill:#9aa298}.a{fill:#4ade80}.w{fill:#fbbf63}.box{fill:#151918;stroke:#262b29}.boxa{fill:#12281a;stroke:#4ade80}.rail{fill:#2b2010;stroke:#fbbf63}.lna{stroke:#4ade80}.lnw{stroke:#fbbf63}.num{fill:#12281a}.numt{fill:#4ade80}}</style><defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs>
<rect class="bg" x="-8" y="-8" width="776" height="486" rx="12"/>
<text class="t" x="0" y="18" font-size="16" font-weight="650">How vci decides, for every test unit</text>
<rect class="rail" x="580" y="48" width="100" height="304" rx="12"/>
<text class="w" x="630.0" y="208.0" text-anchor="middle" font-size="22" font-weight="800">RUN</text>
<rect class="box" x="0" y="48" width="520" height="48" rx="10"/>
<circle class="num" cx="24" cy="72" r="13"/><text class="numt" x="24" y="77" text-anchor="middle" font-size="13">1</text>
<text class="t" x="48" y="69" font-weight="650">signature</text>
<text class="m" x="48" y="87" font-size="12">from a key listed in main's .vci/allowed_signers</text>
<path class="lnw" d="M520 72 L578 72" marker-end="url(#arw)"/>
<text class="w" x="550.0" y="66" text-anchor="middle" font-size="11.5" font-weight="600">no</text>
<path class="lna" d="M24 96 L24 110" marker-end="url(#ara)"/>
<text class="a" x="34" y="108" font-size="11.5" font-weight="600">yes</text>
<rect class="box" x="0" y="112" width="520" height="48" rx="10"/>
<circle class="num" cx="24" cy="136" r="13"/><text class="numt" x="24" y="141" text-anchor="middle" font-size="13">2</text>
<text class="t" x="48" y="133" font-weight="650">not expired</text>
<text class="m" x="48" y="151" font-size="12">and within the policy's max_ttl</text>
<path class="lnw" d="M520 136 L578 136" marker-end="url(#arw)"/>
<text class="w" x="550.0" y="130" text-anchor="middle" font-size="11.5" font-weight="600">no</text>
<path class="lna" d="M24 160 L24 174" marker-end="url(#ara)"/>
<text class="a" x="34" y="172" font-size="11.5" font-weight="600">yes</text>
<rect class="box" x="0" y="176" width="520" height="48" rx="10"/>
<circle class="num" cx="24" cy="200" r="13"/><text class="numt" x="24" y="205" text-anchor="middle" font-size="13">3</text>
<text class="t" x="48" y="197" font-weight="650">same toolchain</text>
<text class="m" x="48" y="215" font-size="12">project, runner and language versions match</text>
<path class="lnw" d="M520 200 L578 200" marker-end="url(#arw)"/>
<text class="w" x="550.0" y="194" text-anchor="middle" font-size="11.5" font-weight="600">no</text>
<path class="lna" d="M24 224 L24 238" marker-end="url(#ara)"/>
<text class="a" x="34" y="236" font-size="11.5" font-weight="600">yes</text>
<rect class="box" x="0" y="240" width="520" height="48" rx="10"/>
<circle class="num" cx="24" cy="264" r="13"/><text class="numt" x="24" y="269" text-anchor="middle" font-size="13">4</text>
<text class="t" x="48" y="261" font-weight="650">same inputs</text>
<text class="m" x="48" y="279" font-size="12">every recorded file re-hashed here gives the same root</text>
<path class="lnw" d="M520 264 L578 264" marker-end="url(#arw)"/>
<text class="w" x="550.0" y="258" text-anchor="middle" font-size="11.5" font-weight="600">no</text>
<path class="lna" d="M24 288 L24 302" marker-end="url(#ara)"/>
<text class="a" x="34" y="300" font-size="11.5" font-weight="600">yes</text>
<rect class="box" x="0" y="304" width="520" height="48" rx="10"/>
<circle class="num" cx="24" cy="328" r="13"/><text class="numt" x="24" y="333" text-anchor="middle" font-size="13">5</text>
<text class="t" x="48" y="325" font-weight="650">same env</text>
<text class="m" x="48" y="343" font-size="12">declared environment variables hash the same</text>
<path class="lnw" d="M520 328 L578 328" marker-end="url(#arw)"/>
<text class="w" x="550.0" y="322" text-anchor="middle" font-size="11.5" font-weight="600">no</text>
<path class="lna" d="M24 352 L24 364" marker-end="url(#ara)"/>
<rect class="boxa" x="0" y="366" width="520" height="44" rx="10"/>
<text class="a" x="16" y="393" font-size="14" font-weight="750">all five yes → SKIP</text>
<text class="m" x="180" y="393" font-size="12">recorded in the audit log, with who vouched for it</text>
<text class="t" x="0" y="436" font-size="12.5" font-weight="650">RUN is the default.</text>
<text class="m" x="130" y="436" font-size="12.5">Any error, a missing store, a refused unit, or a ref in no_skip_refs (such as main) also means RUN.</text>
<text class="m" x="0" y="456" font-size="12.5">A mistake can only cost a skip, never cause one.</text>
</svg>