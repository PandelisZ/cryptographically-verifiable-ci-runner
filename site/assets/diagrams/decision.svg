<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 716 350" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" role="img" aria-label="The checks a unit must pass to be skipped; any failure means it runs"><style>.t{fill:#1b1d1a}.m{fill:#5d635b}.a{fill:#15803d}.w{fill:#b45309}.box{fill:#ffffff;stroke:#e1e2dc;stroke-width:1.3}.boxa{fill:#e3f3e7;stroke:#15803d;stroke-width:1.3}.boxw{fill:#fdf0dc;stroke:#b45309;stroke-width:1.3}.boxg{fill:#f2f2ee;stroke:#e1e2dc;stroke-width:1.2}.ln{stroke:#9aa298;stroke-width:1.5;fill:none}.lna{stroke:#15803d;stroke-width:1.8;fill:none}.lnw{stroke:#b45309;stroke-width:1.8;fill:none}.dash{stroke-dasharray:5 4}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-color-scheme:dark){.t{fill:#e6e9e4}.m{fill:#9aa298}.a{fill:#4ade80}.w{fill:#fbbf63}.box{fill:#151918;stroke:#262b29}.boxa{fill:#12281a;stroke:#4ade80}.boxw{fill:#2b2010;stroke:#fbbf63}.boxg{fill:#0a0c0b;stroke:#262b29}.ln{stroke:#5d635b}.lna{stroke:#4ade80}.lnw{stroke:#fbbf63}}.bg{fill:#fbfbf9}@media(prefers-color-scheme:dark){.bg{fill:#0e1110}}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa298"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><rect class="bg" x="-8" y="-8" width="716" height="350" rx="12"/><text class="t" x="0" y="18" font-size="16" font-weight="650">How vci decides, for every test unit</text><rect class="box" x="0" y="44" width="420" height="34" rx="8"/><text class="t" x="14" y="66" >1.  signature by a key in main's allowed_signers?</text><path class="lnw" d="M420 61 L470 61" marker-end="url(#ar)"/><text class="w" x="478" y="65" font-size="12">no →</text><path class="lna" d="M210 78 L210 90" marker-end="url(#ara)"/><rect class="box" x="0" y="90" width="420" height="34" rx="8"/><text class="t" x="14" y="112" >2.  not expired, within policy max_ttl?</text><path class="lnw" d="M420 107 L470 107" marker-end="url(#ar)"/><text class="w" x="478" y="111" font-size="12">no →</text><path class="lna" d="M210 124 L210 136" marker-end="url(#ara)"/><rect class="box" x="0" y="136" width="420" height="34" rx="8"/><text class="t" x="14" y="158" >3.  same project, runner and toolchain versions?</text><path class="lnw" d="M420 153 L470 153" marker-end="url(#ar)"/><text class="w" x="478" y="157" font-size="12">no →</text><path class="lna" d="M210 170 L210 182" marker-end="url(#ara)"/><rect class="box" x="0" y="182" width="420" height="34" rx="8"/><text class="t" x="14" y="204" >4.  every recorded input re-hashed here: same root?</text><path class="lnw" d="M420 199 L470 199" marker-end="url(#ar)"/><text class="w" x="478" y="203" font-size="12">no →</text><path class="lna" d="M210 216 L210 228" marker-end="url(#ara)"/><rect class="box" x="0" y="228" width="420" height="34" rx="8"/><text class="t" x="14" y="250" >5.  declared env vars: same hashes?</text><path class="lnw" d="M420 245 L470 245" marker-end="url(#ar)"/><text class="w" x="478" y="249" font-size="12">no →</text><rect class="boxa" x="0" y="280" width="420" height="36" rx="8"/><text class="a" x="14" y="303" font-weight="650">all yes → SKIP  (recorded in the audit log, with who vouched)</text><rect class="boxw" x="500" y="44" width="180" height="272" rx="10"/><text class="w" x="518" y="70" font-size="20" font-weight="700">RUN</text><text class="m" x="518" y="96" font-size="12">the default verdict</text><text class="m" x="518" y="114" font-size="12">also on any error, a</text><text class="m" x="518" y="130" font-size="12">missing store, a refused</text><text class="m" x="518" y="146" font-size="12">unit, or refs listed in</text><text class="m" x="518" y="162" font-size="12">no_skip_refs (main).</text><text class="t" x="518" y="196" font-size="12.5" font-weight="600">A mistake can only</text><text class="t" x="518" y="212" font-size="12.5" font-weight="600">cost a skip, never</text><text class="t" x="518" y="228" font-size="12.5" font-weight="600">cause one.</text></svg>