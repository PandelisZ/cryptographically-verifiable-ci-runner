<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 756 354" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" role="img" aria-label="Attestations are git-meta metadata on refs/meta/main, attached to each unit's path"><style>.t{fill:#1b1d1a}.m{fill:#5d635b}.a{fill:#15803d}.w{fill:#b45309}.box{fill:#ffffff;stroke:#e1e2dc;stroke-width:1.3}.boxa{fill:#e3f3e7;stroke:#15803d;stroke-width:1.3}.boxw{fill:#fdf0dc;stroke:#b45309;stroke-width:1.3}.boxg{fill:#f2f2ee;stroke:#e1e2dc;stroke-width:1.2}.ln{stroke:#9aa298;stroke-width:1.5;fill:none}.lna{stroke:#15803d;stroke-width:1.8;fill:none}.lnw{stroke:#b45309;stroke-width:1.8;fill:none}.dash{stroke-dasharray:5 4}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-color-scheme:dark){.t{fill:#e6e9e4}.m{fill:#9aa298}.a{fill:#4ade80}.w{fill:#fbbf63}.box{fill:#151918;stroke:#262b29}.boxa{fill:#12281a;stroke:#4ade80}.boxw{fill:#2b2010;stroke:#fbbf63}.boxg{fill:#0a0c0b;stroke:#262b29}.ln{stroke:#5d635b}.lna{stroke:#4ade80}.lnw{stroke:#fbbf63}}.bg{fill:#fbfbf9}@media(prefers-color-scheme:dark){.bg{fill:#0e1110}}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa298"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><rect class="bg" x="-8" y="-8" width="756" height="354" rx="12"/><text class="t" x="0" y="18" font-size="16" font-weight="650">Where attestations live</text><rect class="box" x="0" y="40" width="300" height="190" rx="8"/><text class="t" x="14" y="62" font-weight="600">your git remote</text><rect class="boxg" x="14" y="78" width="272" height="24" rx="6"/><text class="mono t" x="24" y="95" font-size="12">refs/heads/main</text><rect class="boxg" x="14" y="108" width="272" height="24" rx="6"/><text class="mono t" x="24" y="125" font-size="12">refs/heads/agent/orders</text><rect class="boxa" x="14" y="138" width="272" height="24" rx="6"/><text class="mono t" x="24" y="155" font-size="12">refs/meta/main        ← git-meta</text><text class="m" x="14" y="186" font-size="12">Ordinary git objects. No server, no database.</text><text class="m" x="14" y="204" font-size="12">vci push / vci fetch, or git meta push / pull.</text><rect class="box" x="340" y="40" width="400" height="190" rx="8"/><text class="t" x="354" y="62" font-weight="600">inside refs/meta/main</text><text class="mono t" x="354" y="90" font-size="12">path:spec/models/order_spec.rb</text><text class="mono m" x="370" y="110" font-size="11">vci:attestation:&lt;unit&gt;:&lt;signer&gt;:&lt;inputs&gt;  = envelope</text><text class="mono t" x="354" y="140" font-size="12">path:pkg/pricing</text><text class="mono m" x="370" y="160" font-size="11">vci:attestation:&lt;unit&gt;:&lt;signer&gt;:&lt;inputs&gt;  = envelope</text><text class="m" x="354" y="192" font-size="12">One value per (unit, signer, inputs). Re-attesting the same</text><text class="m" x="354" y="208" font-size="12">thing overwrites; different signers never collide.</text><rect class="boxw" x="0" y="250" width="740" height="76" rx="10"/><text class="w" x="14" y="272" font-weight="650">Metadata is not trusted on its own.</text><text class="m" x="14" y="292" font-size="12">Anyone with push access can write or delete it. A value only causes a skip if its signature verifies and every input matches.</text><text class="m" x="14" y="310" font-size="12">Deleting one only makes a test run.</text></svg>