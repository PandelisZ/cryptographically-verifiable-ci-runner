<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 776 376" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" role="img" aria-label="The fields of an attestation and how inputs are hashed"><style>.t{fill:#1b1d1a}.m{fill:#5d635b}.a{fill:#15803d}.w{fill:#b45309}.box{fill:#ffffff;stroke:#e1e2dc;stroke-width:1.3}.boxa{fill:#e3f3e7;stroke:#15803d;stroke-width:1.3}.boxw{fill:#fdf0dc;stroke:#b45309;stroke-width:1.3}.boxg{fill:#f2f2ee;stroke:#e1e2dc;stroke-width:1.2}.ln{stroke:#9aa298;stroke-width:1.5;fill:none}.lna{stroke:#15803d;stroke-width:1.8;fill:none}.lnw{stroke:#b45309;stroke-width:1.8;fill:none}.dash{stroke-dasharray:5 4}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-color-scheme:dark){.t{fill:#e6e9e4}.m{fill:#9aa298}.a{fill:#4ade80}.w{fill:#fbbf63}.box{fill:#151918;stroke:#262b29}.boxa{fill:#12281a;stroke:#4ade80}.boxw{fill:#2b2010;stroke:#fbbf63}.boxg{fill:#0a0c0b;stroke:#262b29}.ln{stroke:#5d635b}.lna{stroke:#4ade80}.lnw{stroke:#fbbf63}}.bg{fill:#fbfbf9}@media(prefers-color-scheme:dark){.bg{fill:#0e1110}}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa298"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><rect class="bg" x="-8" y="-8" width="776" height="376" rx="12"/><text class="t" x="0" y="18" font-size="16" font-weight="650">What one attestation contains</text><rect class="box" x="0" y="36" width="420" height="320" rx="12"/><text class="m" x="16" y="64" font-size="12">unit</text><text class="mono t" x="150" y="64" font-size="12">spec/models/order_spec.rb</text><text class="m" x="16" y="92" font-size="12">project / runner</text><text class="mono t" x="150" y="92" font-size="12">rails · rspec</text><text class="m" x="16" y="120" font-size="12">repository</text><text class="mono t" x="150" y="120" font-size="12">root commit 35a4ec3…</text><text class="m" x="16" y="148" font-size="12">toolchain</text><text class="mono t" x="150" y="148" font-size="12">ruby 3.4.9 · rails 8 · rspec 3.13</text><text class="m" x="16" y="176" font-size="12">inputs</text><text class="mono t" x="150" y="176" font-size="12">318 files + listings + probes → root 21ff5d…</text><text class="m" x="16" y="204" font-size="12">env</text><text class="mono t" x="150" y="204" font-size="12">TZ=…hash  RAILS_ENV=…hash</text><text class="m" x="16" y="232" font-size="12">result</text><text class="mono t" x="150" y="232" font-size="12">passed · 3 examples</text><text class="m" x="16" y="260" font-size="12">issued / expires</text><text class="mono t" x="150" y="260" font-size="12">2026-10-03 → 2026-10-17</text><line class="ln" x1="16" x2="404" y1="278" y2="278"/><text class="m" x="16" y="300" font-size="12">signature</text><text class="mono a" x="150" y="300" font-size="12">ssh-ed25519 · SHA256:RASHZ3Nm…</text><text class="m" x="150" y="318" font-size="11.5">signed by build-agent, verified against allowed_signers on main</text><rect class="boxg" x="450" y="36" width="290" height="150" rx="8"/><text class="t" x="466" y="58" font-weight="600" font-size="12.5">each input is a hash, never content</text><text class="mono t" x="466" y="84" font-size="12">app/models/order.rb   blake3 9b0f5f…</text><text class="mono t" x="466" y="106" font-size="12">spec/factories/…rb    blake3 52e17e…</text><text class="mono t" x="466" y="128" font-size="12">db/schema.rb          blake3 c7a1d0…</text><text class="mono t" x="466" y="150" font-size="12">config/missing.yml    absent</text><text class="mono t" x="466" y="172" font-size="12">spec/support/  listing 3 entries</text><rect class="boxg" x="450" y="206" width="290" height="96" rx="8"/><text class="t" x="466" y="228" font-weight="600" font-size="12.5">so CI can re-check it</text><text class="m" x="466" y="250" font-size="12">CI hashes the same paths in its own checkout.</text><text class="m" x="466" y="268" font-size="12">Same root → the test is skipped.</text><text class="m" x="466" y="286" font-size="12">Anything differs → it runs.</text></svg>