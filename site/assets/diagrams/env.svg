<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 756 361" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" role="img" aria-label="In strict mode only declared and pass-through variables reach tests; declared ones are hashed"><style>.t{fill:#1b1d1a}.m{fill:#5d635b}.a{fill:#15803d}.w{fill:#b45309}.box{fill:#ffffff;stroke:#e1e2dc;stroke-width:1.3}.boxa{fill:#e3f3e7;stroke:#15803d;stroke-width:1.3}.boxw{fill:#fdf0dc;stroke:#b45309;stroke-width:1.3}.boxg{fill:#f2f2ee;stroke:#e1e2dc;stroke-width:1.2}.ln{stroke:#9aa298;stroke-width:1.5;fill:none}.lna{stroke:#15803d;stroke-width:1.8;fill:none}.lnw{stroke:#b45309;stroke-width:1.8;fill:none}.dash{stroke-dasharray:5 4}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-color-scheme:dark){.t{fill:#e6e9e4}.m{fill:#9aa298}.a{fill:#4ade80}.w{fill:#fbbf63}.box{fill:#151918;stroke:#262b29}.boxa{fill:#12281a;stroke:#4ade80}.boxw{fill:#2b2010;stroke:#fbbf63}.boxg{fill:#0a0c0b;stroke:#262b29}.ln{stroke:#5d635b}.lna{stroke:#4ade80}.lnw{stroke:#fbbf63}}.bg{fill:#fbfbf9}@media(prefers-color-scheme:dark){.bg{fill:#0e1110}}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa298"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><rect class="bg" x="-8" y="-8" width="756" height="361" rx="12"/><text class="t" x="0" y="18" font-size="16" font-weight="650">Environment variables: strict mode</text><rect class="boxg" x="0" y="40" width="210" height="200" rx="8"/><text class="t" x="14" y="62" font-weight="600" font-size="12.5">the machine's environment</text><text class="mono t" x="14" y="90" font-size="12">TZ=UTC</text><text class="mono t" x="14" y="110" font-size="12">DATABASE_URL=…</text><text class="mono t" x="14" y="130" font-size="12">AWS_SECRET=…</text><text class="mono t" x="14" y="150" font-size="12">PATH=…</text><text class="mono t" x="14" y="170" font-size="12">RANDOM_THING=…</text><text class="mono t" x="14" y="190" font-size="12">NO_COLOR=1</text><rect class="box" x="260" y="40" width="200" height="200" rx="8"/><text class="t" x="274" y="62" font-weight="600" font-size="12.5">what the test can see</text><text class="mono a" x="274" y="90" font-size="12">TZ=UTC</text><text class="mono a" x="274" y="110" font-size="12">DATABASE_URL=…</text><text class="mono t" x="274" y="130" font-size="12">AWS_SECRET=…</text><text class="mono t" x="274" y="150" font-size="12">PATH=…</text><text class="m" x="274" y="180" font-size="12">RANDOM_THING, NO_COLOR:</text><text class="m" x="274" y="196" font-size="12">removed (undeclared)</text><rect class="boxa" x="510" y="40" width="230" height="200" rx="8"/><text class="t" x="524" y="62" font-weight="600" font-size="12.5">what gets hashed</text><text class="mono a" x="524" y="90" font-size="12">TZ        → hash</text><text class="mono a" x="524" y="110" font-size="12">DATABASE_URL → hash</text><text class="m" x="524" y="140" font-size="12">AWS_SECRET: pass_through,</text><text class="m" x="524" y="156" font-size="12">visible but never hashed</text><text class="m" x="524" y="180" font-size="12">PATH, HOME…: built-in</text><text class="m" x="524" y="196" font-size="12">pass-through; hashed only</text><text class="m" x="524" y="212" font-size="12">if the test reads them</text><path class="ln" d="M210 140 L260 140" marker-end="url(#ar)"/><path class="ln" d="M460 140 L510 140" marker-end="url(#ar)"/><rect class="box" x="0" y="262" width="740" height="70" rx="10"/><text class="mono t" x="14" y="284" font-size="12">[env]  mode = "strict"</text><text class="mono t" x="14" y="304" font-size="12">global = ["TZ", "DATABASE_URL"]      pass_through = ["AWS_SECRET"]</text><text class="m" x="14" y="324" font-size="12">Declared variables are hashed into every unit's inputs; CI must have the same values for a skip.</text></svg>