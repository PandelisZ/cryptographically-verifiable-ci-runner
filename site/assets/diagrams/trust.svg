<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 656 346" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" role="img" aria-label="CI reads trusted keys and policy from the base branch, never from the pull request"><style>.t{fill:#1b1d1a}.m{fill:#5d635b}.a{fill:#15803d}.w{fill:#b45309}.box{fill:#ffffff;stroke:#e1e2dc;stroke-width:1.3}.boxa{fill:#e3f3e7;stroke:#15803d;stroke-width:1.3}.boxw{fill:#fdf0dc;stroke:#b45309;stroke-width:1.3}.boxg{fill:#f2f2ee;stroke:#e1e2dc;stroke-width:1.2}.ln{stroke:#9aa298;stroke-width:1.5;fill:none}.lna{stroke:#15803d;stroke-width:1.8;fill:none}.lnw{stroke:#b45309;stroke-width:1.8;fill:none}.dash{stroke-dasharray:5 4}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-color-scheme:dark){.t{fill:#e6e9e4}.m{fill:#9aa298}.a{fill:#4ade80}.w{fill:#fbbf63}.box{fill:#151918;stroke:#262b29}.boxa{fill:#12281a;stroke:#4ade80}.boxw{fill:#2b2010;stroke:#fbbf63}.boxg{fill:#0a0c0b;stroke:#262b29}.ln{stroke:#5d635b}.lna{stroke:#4ade80}.lnw{stroke:#fbbf63}}.bg{fill:#fbfbf9}@media(prefers-color-scheme:dark){.bg{fill:#0e1110}}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa298"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><rect class="bg" x="-8" y="-8" width="656" height="346" rx="12"/><text class="t" x="0" y="18" font-size="16" font-weight="650">Where CI gets the rules from</text><rect class="boxa" x="0" y="40" width="300" height="170" rx="8"/><text class="t" x="14" y="62" font-weight="600">main  (the base branch)</text><rect class="box" x="14" y="76" width="272" height="26" rx="6"/><text class="mono t" x="24" y="94" font-size="12">.vci/allowed_signers</text><rect class="box" x="14" y="108" width="272" height="26" rx="6"/><text class="mono t" x="24" y="126" font-size="12">vci.toml  (policy)</text><text class="m" x="14" y="160" >Only what has been merged here counts.</text><text class="m" x="14" y="178" >Changing it needs a review on main.</text><rect class="boxw" x="340" y="40" width="300" height="170" rx="8"/><text class="t" x="354" y="62" font-weight="600">the pull request branch</text><rect class="box" x="354" y="76" width="272" height="26" rx="6"/><text class="mono t" x="364" y="94" font-size="12">.vci/allowed_signers  + attacker key</text><rect class="box" x="354" y="108" width="272" height="26" rx="6"/><text class="mono t" x="364" y="126" font-size="12">vci.toml  (loosened)</text><text class="w" x="354" y="160" font-weight="600">Ignored for trust decisions.</text><text class="m" x="354" y="178" >Only its code and attestations are looked at.</text><rect class="box" x="180" y="250" width="320" height="70" rx="8"/><text class="t" x="196" y="274" font-weight="600">CI runner</text><text class="mono t" x="196" y="296" font-size="12">vci ci --base-ref &lt;base commit on main&gt;</text><path class="lna" d="M150 210 C 205.0 210, 205.0 250, 260 250" marker-end="url(#ara)"/><text class="a" x="80" y="240" font-size="12">keys + policy</text><path class="lnw" d="M490 210 C 455.0 210, 455.0 250, 420 250" marker-end="url(#arw)"/><text class="w" x="470" y="240" font-size="12">code + attestations</text></svg>