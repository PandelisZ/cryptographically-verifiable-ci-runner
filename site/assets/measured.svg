<text class="m" x="330" y="402" font-size="11">vci 6 s · tests 5 s · run 38689085904</text>
<line class="g" x1="0" x2="1000" y1="420" y2="420"/>
<text class="t" x="0" y="450" font-weight="600">1.4.0 release commit</text>
<text class="m" x="0" y="468">Rails, RSpec, Rust re-attested; vci compiled from source</text>
<rect class="setup" x="330.0" y="436" width="78.1" height="18" rx="3"/>
<rect class="ovh" x="408.1" y="436" width="18.2" height="18" rx="3"/>
<rect class="tests" x="426.4" y="436" width="83.3" height="18" rx="3"/>
<rect class="build" x="509.7" y="436" width="338.6" height="18" rx="3"/>
<text class="v" x="856.3" y="450">199 s, 69 s without the compile</text>
<text class="m" x="330" y="468" font-size="11">vci 7 s · tests 32 s · run 38765949660</text>
<line class="g" x1="0" x2="1000" y1="486" y2="486"/>
<text class="t" x="0" y="516" font-weight="600">1.4.0 manifest commit</text>
<text class="m" x="0" y="534">nothing to run in any project</text>
<rect class="setup" x="330.0" y="502" width="86.0" height="18" rx="3"/>
<rect class="ovh" x="416.0" y="502" width="15.6" height="18" rx="3"/>
<rect class="tests" x="431.6" y="502" width="10.4" height="18" rx="3"/>
<text class="v" x="450.0" y="516">43 s</text>
<text class="m" x="330" y="534" font-size="11">vci 6 s · tests 4 s · run 38766523295</text>
<line class="g" x1="0" x2="1000" y1="552" y2="552"/>
<text class="m" x="0" y="606">The floor is GitHub's own setup. vci costs 6 to 7 s to fetch and plan; with nothing to run the job finishes in 40 to 43 s against 47 s for the plain full run of this small suite.</text>
</svg>