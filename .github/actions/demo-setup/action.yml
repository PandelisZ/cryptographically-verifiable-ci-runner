# Toolchains and dependencies of demo/ (shared by the pull request and the
# main-branch jobs of .github/workflows/ci.yml). Runs after actions/checkout.
name: demo setup
description: Set up the toolchains and dependencies of the demo projects.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.7"

    - uses: actions/setup-go@v5
      with:
        go-version: "1.26.2"
        cache-dependency-path: demo/go-app/go.sum

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.95.0" # same as demo/cargo-app/rust-toolchain.toml

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4.9" # same as demo/rails-app/.ruby-version
        bundler-cache: true
        working-directory: demo/rails-app

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4.9" # same as demo/rspec-app/.ruby-version
        bundler-cache: true
        working-directory: demo/rspec-app

    - name: Set up project dependencies
      shell: bash
      run: |
        (cd demo/pytest-app && uv sync --locked)
        (cd demo/go-app && go mod download)
        (cd demo/cargo-app && cargo fetch --locked)
