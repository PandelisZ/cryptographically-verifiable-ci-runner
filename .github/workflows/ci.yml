# Demo and self-test of the vci action: run only the pytest files, Go packages,
# cargo test targets and Rails test files of demo/ that no trusted signer has already attested.
#
# This repository uses the action from its own checkout (`uses: ./`). Other
# repositories use `@v1` (or a release tag / full SHA): see docs/GITHUB_ACTIONS.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed
  CGO_ENABLED: "0"
  TZ: UTC

jobs:
  # Pull requests (and pushes to other branches) consume attestations only:
  # no signing key, read-only token. A pull_request run uses the branch's own
  # copy of this file, so the key must not be reachable from here at all: it
  # is a secret of the vci-attest environment, whose deployment branches are
  # limited to main (Settings -> Environments), never a repository secret.
  demo:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit must be available to read policy from

      - uses: ./.github/actions/demo-setup

      # Fetches the attestations (git-meta metadata on refs/meta/main of this
      # repository, pushed with `vci push`), plans, and runs the rest.
      - uses: ./

      - name: Show the audit log
        if: always()
        run: cat vci-audit.json

  # Pushes to main also attest what they run with the CI key (principal
  # github-actions in .vci/allowed_signers, listed in
  # policy.no_skip_refs_except) and push the attestations, so the next commit
  # of main skips every unit whose inputs did not change.
  demo-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: vci-attest
    # `vci ci --push` publishes the attestations it makes (git-meta pushes
    # refs/meta/main with the checkout's credentials).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/demo-setup

      - uses: ./
        with:
          signing-key: ${{ secrets.VCI_SIGNING_KEY }}

      - name: Show the audit log
        if: always()
        run: cat vci-audit.json

  # The published action, as other repositories use it: resolves @v1, downloads
  # the release binary and plans the pytest project only.
  action-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: cd demo/pytest-app && uv sync --locked
      - uses: PandelisZ/cryptographically-verifiable-ci-runner@v1
        with:
          command: plan
