# Demo and self-test of the vci action: run only the pytest files of
# demo/pytest-app that no trusted signer has already attested.
#
# This repository uses the action from its own checkout (`uses: ./`). Other
# repositories pin a commit instead, so a pull request cannot change the
# verifier it is checked by: see docs/GITHUB_ACTIONS.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit must be available to read policy from

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"

      - name: Set up the project environment from uv.lock
        working-directory: demo/pytest-app
        run: uv sync --locked

      - uses: ./

      - name: Show the audit log
        if: always()
        run: cat vci-audit.json
