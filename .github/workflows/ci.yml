# Demo and self-test of the vci action: run only the pytest files, Go packages
# and cargo test targets of demo/ that no trusted signer has already attested.
#
# This repository uses the action from its own checkout (`uses: ./`). Other
# repositories pin a commit instead, so a pull request cannot change the
# verifier it is checked by: see docs/GITHUB_ACTIONS.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed
  CGO_ENABLED: "0"
  TZ: UTC

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit must be available to read policy from

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: demo/go-app/go.sum

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0" # same as demo/cargo-app/rust-toolchain.toml

      - name: Set up project dependencies
        run: |
          (cd demo/pytest-app && uv sync --locked)
          (cd demo/go-app && go mod download)
          (cd demo/cargo-app && cargo fetch --locked)

      - uses: ./

      - name: Show the audit log
        if: always()
        run: cat vci-audit.json
