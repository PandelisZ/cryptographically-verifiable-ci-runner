# Demo: run only the pytest files that no trusted signer has already attested
# for these exact inputs. vci is built from this repository's own sources; a
# real project would install a pinned release instead, so that a pull request
# cannot change the verifier it is checked by.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit must be available to read policy from

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"

      - uses: Swatinem/rust-cache@v2

      - name: Build vci
        run: |
          cargo build --release --locked -p vci-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          echo "VCI_PY_PLUGIN=$PWD/py/pytest-plugin" >> "$GITHUB_ENV"

      - name: Set up the project environment from uv.lock
        working-directory: demo/pytest-app
        run: uv sync --locked

      - name: Fetch attestations
        run: vci fetch --remote origin

      - name: Plan
        run: |
          vci plan --base-ref "$BASE" --format text | tee plan.txt
          {
            echo '### vci plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Run what is not attested
        run: vci ci --base-ref "$BASE" --audit-log vci-audit.json
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Upload the audit log of skipped tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vci-audit
          path: vci-audit.json
