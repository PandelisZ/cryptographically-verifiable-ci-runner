# Demo and self-test of the vci action: run only the pytest files, Go packages,
# cargo test targets and Rails test files of demo/ that no trusted signer has already attested.
#
# This repository uses the action from its own checkout (`uses: ./`). Other
# repositories use `@v1` (or the full SHA v1 points to): see docs/GITHUB_ACTIONS.md.
#
# The demo and demo-main jobs test the development version of vci, whose
# sources usually have no published binary yet, so they pass
# `build-from-source: true`. They are the only place vci is ever compiled in CI
# (release.yml builds the published binaries): the action never compiles
# unless asked to, and fails instead when it has no published binary.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# TZ and CGO_ENABLED come from vci.toml ([env] set): vci sets them in every
# test process, here and on laptops alike.
env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  # Pull requests (and pushes to other branches) consume attestations only:
  # no signing key, read-only token. A pull_request run uses the branch's own
  # copy of this file, so the key must not be reachable from here at all: it
  # is a secret of the vci-attest environment, whose deployment branches are
  # limited to main (Settings -> Environments), never a repository secret.
  demo:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit must be available to read policy from

      - uses: ./.github/actions/demo-setup

      # Fetches the attestations (git-meta metadata on refs/meta/main of this
      # repository, pushed with `vci push`), plans, and runs the rest. Compiles
      # this commit's vci (cached) unless it is a published release.
      - uses: ./
        with:
          build-from-source: true

      - name: Show the audit log
        if: always()
        run: cat vci-audit.json

  # Pushes to main also attest what they run with the CI key (principal
  # github-actions in .vci/allowed_signers, listed in
  # policy.no_skip_refs_except) and push the attestations, so the next commit
  # of main skips every unit whose inputs did not change.
  demo-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: vci-attest
    # `vci ci --push` publishes the attestations it makes (git-meta pushes
    # refs/meta/main with the checkout's credentials).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/demo-setup

      - uses: ./
        with:
          build-from-source: true # this commit's vci, as in the demo job
          signing-key: ${{ secrets.VCI_SIGNING_KEY }}

      - name: Show the audit log
        if: always()
        run: cat vci-audit.json

  # Keyless attestation (OIDC / Sigstore), no secret at all: on pull requests
  # this job attests the demo units with its own OIDC token (`vci run
  # --oidc`: an ephemeral key certified by fulcio.githubapp.com, a timestamp
  # from timestamp.githubapp.com per unit), then plans twice against base
  # commits built locally (never pushed) on the pull request's base (the
  # merge commit's first parent): one with this commit's .vci/identities.toml
  # (identity: this workflow on refs/pull/*/merge, principal
  # github-actions-oidc-pr) and trust root added, where every unit it
  # attested must be skipped on that word, and one with both files removed,
  # where none may be. The commit under test has the files in both plans, so
  # this shows trust is read from the base commit, not from the pull request.
  # It starts from an empty store (no fetch), so the SSH key's attestations
  # from main play no part.
  demo-oidc:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/demo-setup

      - name: Build vci from this commit
        run: |
          cargo build --release --locked -p vci-cli
          {
            echo "$PWD/target/release"
          } >> "$GITHUB_PATH"
          {
            echo "VCI_PY_PLUGIN=$PWD/py/pytest-plugin"
            echo "VCI_JS_PLUGIN=$PWD/js/vitest-plugin"
            echo "VCI_RUBY_COLLECTOR=$PWD/ruby/vci-collector"
          } >> "$GITHUB_ENV"

      - name: Attest keylessly with the job's OIDC token
        run: vci run --oidc --ttl 1d --summary "$RUNNER_TEMP/run-summary.json"

      # Two base commits on the pull request's base, local to this job:
      # with-trust adds this commit's identities.toml and trust root,
      # without-trust removes them (whatever the base branch has).
      - name: Build the base commits to plan against
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD^1)
          files=(.vci/identities.toml .vci/sigstore-trusted-root.json)
          export GIT_INDEX_FILE="$RUNNER_TEMP/base.index"
          export GIT_AUTHOR_NAME=vci GIT_AUTHOR_EMAIL=vci@localhost GIT_COMMITTER_NAME=vci GIT_COMMITTER_EMAIL=vci@localhost
          git read-tree "$base"
          git rm -q --cached --ignore-unmatch -- "${files[@]}"
          without=$(git commit-tree "$(git write-tree)" -p "$base" -m 'base without keyless trust')
          for f in "${files[@]}"; do
            git update-index --add --cacheinfo "100644,$(git rev-parse "HEAD:$f"),$f"
          done
          with=$(git commit-tree "$(git write-tree)" -p "$base" -m 'base with keyless trust')
          rm -f "$GIT_INDEX_FILE"
          echo "pull request base $base; with trust $with; without trust $without"
          {
            echo "BASE_WITH_TRUST=$with"
            echo "BASE_WITHOUT_TRUST=$without"
          } >> "$GITHUB_ENV"

      - name: Plan on the keyless attestations
        run: |
          set -o pipefail
          attested=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["attested"])' "$RUNNER_TEMP/run-summary.json")
          skip_re='^SKIP .*(attested by github-actions-oidc-pr (oidc repo:PandelisZ/cryptographically-verifiable-ci-runner workflow:.github/workflows/ci.yml ref:refs/pull/'
          vci plan --base-ref "$BASE_WITH_TRUST" | tee "$RUNNER_TEMP/plan.txt"
          by_oidc=$(grep -c "$skip_re" "$RUNNER_TEMP/plan.txt" || true)
          vci plan --base-ref "$BASE_WITHOUT_TRUST" 2>&1 | tee "$RUNNER_TEMP/plan-untrusted.txt"
          untrusted=$(grep -c "$skip_re" "$RUNNER_TEMP/plan-untrusted.txt" || true)
          echo "attested keylessly: $attested; skipped on a keyless attestation: $by_oidc with the base's trust, $untrusted without it"
          if [ "$attested" -eq 0 ] || [ "$by_oidc" -ne "$attested" ]; then
            echo "::error title=vci::expected every keylessly attested unit ($attested) to be skipped on its attestation ($by_oidc)"
            exit 1
          fi
          if [ "$untrusted" -ne 0 ]; then
            echo "::error title=vci::$untrusted unit(s) skipped on a keyless attestation although the base commit has no identities.toml or trust root"
            exit 1
          fi
          if ! grep -q 'identities.toml' "$RUNNER_TEMP/plan-untrusted.txt"; then
            echo "::error title=vci::the plan without the base's trust does not say why keyless attestations are not trusted"
            exit 1
          fi
          first=$(grep -m1 '^SKIP ' "$RUNNER_TEMP/plan.txt" | awk '{print $2}')
          vci explain "$first" --base-ref "$BASE_WITH_TRUST"
          vci explain "$first" --base-ref "$BASE_WITHOUT_TRUST" || true
          {
            echo '### vci keyless (OIDC) proof'
            echo "$by_oidc of $attested keylessly attested units skipped on their attestation with the base commit's identities.toml and trust root; $untrusted without them"
            echo '```'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One stored envelope (DSSE + Sigstore bundle material), verified with
      # `vci verify` and kept as an artifact (a test fixture for vci).
      - name: Export and verify one keyless envelope
        run: |
          python3 - "$RUNNER_TEMP/keyless-envelope.json" <<'PY'
          import json, sqlite3, subprocess, sys
          db = sqlite3.connect(".git/git-meta.sqlite")
          rows = db.execute("SELECT key, value, is_git_ref FROM metadata WHERE key LIKE 'vci:attestation:%'").fetchall()
          for key, value, is_ref in rows:
              raw = subprocess.run(["git", "cat-file", "blob", value], capture_output=True, check=True).stdout.decode() if is_ref else value
              try:
                  env = json.loads(raw)
                  if isinstance(env, str):
                      env = json.loads(env)
              except ValueError:
                  continue
              if isinstance(env, dict) and "sigstore" in env:
                  json.dump(env, open(sys.argv[1], "w"), indent=1)
                  print(key)
                  break
          else:
              sys.exit("no keyless envelope in the store")
          PY
          vci verify "$RUNNER_TEMP/keyless-envelope.json" --base-ref "$BASE_WITH_TRUST"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyless-envelope
          path: ${{ runner.temp }}/keyless-envelope.json
          if-no-files-found: ignore

  # The attestation stores (docs/STORE-BACKENDS.md): the store crates' own
  # tests and the conformance suite on git-meta, SQLite, PostgreSQL and
  # libSQL (its local file, and a libSQL server remotely and through a
  # replica: the server is the libsql-server image, the one Turso runs,
  # pinned to the sqld release the tests were written against).
  # git-meta runs against the git a stock Ubuntu 24.04 ships (2.43): GitHub's
  # runner images carry a newer git, and 2.0.0's presence check of values not
  # yet downloaded died only on the older one (fixed in 2.0.1). Self-hosted
  # runners (vex's) run the stock one. The job runs as root in its container,
  # where initdb refuses to run, so PostgreSQL is a service container, reached
  # by its name (the server has no TLS: sslmode=disable, which vci would
  # otherwise refuse for a host that is not this machine). The tests that
  # need a non-root user (unwritable files) skip as root; store-pg-initdb
  # covers the throwaway cluster.
  store-stock-git:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: vci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:v0.24.32
    env:
      VCI_TEST_POSTGRES_URL: postgres://postgres:vci@postgres:5432/postgres?sslmode=disable
      VCI_TEST_POSTGRES: require
      VCI_TEST_LIBSQL_URL: http://libsql:8080
      VCI_TEST_LIBSQL: require
    steps:
      - name: Stock git and a Rust toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates curl build-essential pkg-config libssl-dev
          git --version
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Store tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email ci@vci.invalid
          git config --global user.name vci
          for i in $(seq 30); do curl -sf "$VCI_TEST_LIBSQL_URL/health" >/dev/null && break; sleep 1; done
          cargo test --locked -p vci-store --features vci-store/conformance -p vci-git -p vci-store-sqlite -p vci-store-postgres
          # One sqld serves every libSQL test: run them one at a time, or a
          # hundred concurrent writers queue on its one write lock and time out.
          cargo test --locked -p vci-store-libsql -- --test-threads=1

  # The store crates' rustdoc: vci-store is the contract a backend implements
  # (its rustdoc is authoritative), and every public item is documented.
  store-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rustdoc of the store crates, warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --locked -p vci-store -p vci-store-sqlite -p vci-store-postgres -p vci-store-libsql
          cargo doc --no-deps --locked -p vci-store --features conformance

  # The command line on each store, end to end (crates/vci-cli/tests/
  # store_select.rs, store_backends.rs and store_credential.rs): selection,
  # secrets kept out of every test's environment, fail open, run, plan,
  # explain, prune, fetch, push and ci on SQLite, PostgreSQL and libSQL
  # (local, remote and replica), and [store] token_command, against a copy of
  # fixtures/go-abcd. The PostgreSQL service is reached on
  # localhost, where vci does not require TLS, and so is the libSQL server.
  # Without go the tests would skip, so the module is downloaded first.
  store-cli:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: vci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:v0.24.32
        ports:
          - 8080:8080
    env:
      VCI_TEST_POSTGRES_URL: postgres://postgres:vci@localhost:5432/postgres
      VCI_TEST_POSTGRES: require
      VCI_TEST_LIBSQL_URL: http://localhost:8080
      VCI_TEST_LIBSQL: require
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: fixtures/go-abcd/go.mod
          cache-dependency-path: fixtures/go-abcd/go.sum
      - name: The fixture's Go modules
        run: cd fixtures/go-abcd && go mod download
      - name: Store selection and the stores end to end
        run: |
          for i in $(seq 30); do curl -sf "$VCI_TEST_LIBSQL_URL/health" >/dev/null && break; sleep 1; done
          cargo test --locked -p vci-cli --test store_select --test store_backends
      # The store job above runs in a container without Docker; here the
      # tests start the libsql-server image themselves, with a JWT key.
      - name: libSQL tokens against a server that checks them
        run: |
          cargo test --locked -p vci-store-libsql --test libsql -- tokens_are_sent_and_never_shown a_token_command_supplies_the_token --nocapture
          cargo test --locked -p vci-cli --test store_credential

  # The temporary-PostgreSQL helper's own path: no server is given, so
  # vci_store_postgres::testkit starts a throwaway cluster with the runner's
  # initdb (as the non-root runner user; initdb refuses root) in en_US.UTF-8,
  # whose linguistic collation the conformance suite's byte-order scenario
  # needs to catch a missing COLLATE "C", and stops and deletes it when the
  # test process exits.
  store-pg-initdb:
    runs-on: ubuntu-latest
    env:
      VCI_TEST_POSTGRES: require
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: PostgreSQL's initdb and the en_US.UTF-8 locale
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql
          fi
          ls /usr/lib/postgresql/*/bin/initdb
          if ! locale -a | grep -qix 'en_US.utf8'; then
            sudo locale-gen en_US.UTF-8
          fi
          locale -a | grep -ix 'en_US.utf8'
          id -u
      - name: The testkit and the conformance suite on a throwaway cluster
        run: |
          unset VCI_TEST_POSTGRES_URL
          cargo test --locked -p vci-store-postgres --test testkit --test conformance

  # Proves on a real runner that a commit of the action with no published
  # binary fails at once (scripts/action-binary.sh) instead of compiling vci.
  # On a commit whose sources match release/manifest.txt the gate passes and
  # action-v1 already proves the download, so the check is skipped there.
  action-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Do these sources have a published binary?
        id: src
        run: |
          here=$(scripts/source-fingerprint.sh)
          recorded=$(sed -n 's/^source=//p' release/manifest.txt)
          if [ "$here" = "$recorded" ]; then echo "released=true"; else echo "released=false"; fi >> "$GITHUB_OUTPUT"
      - name: The action on unreleased sources (expected to fail fast)
        id: gate
        if: steps.src.outputs.released == 'false'
        continue-on-error: true
        uses: ./
        with:
          command: plan
      - name: It failed before compiling
        if: steps.src.outputs.released == 'false'
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::the action ran on unreleased sources instead of refusing (outcome: $OUTCOME)"
            exit 1
          fi
          echo "the action refused to compile on unreleased sources, as intended"

  # The published action, as other repositories use it: resolves @v1, downloads
  # the release binary (about a second, never a compile) and plans the pytest
  # project only.
  action-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: cd demo/pytest-app && uv sync --locked
      - uses: PandelisZ/cryptographically-verifiable-ci-runner@v1
        with:
          command: plan
