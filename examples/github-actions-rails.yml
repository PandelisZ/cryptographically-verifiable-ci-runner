# .github/workflows/test.yml: run only the Rails test files (Minitest or
# RSpec) that no trusted developer has already attested for these exact
# inputs.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rails:
    runs-on: ubuntu-latest
    env:
      # Declared in vci.toml ([env] global = ["TZ"]) and set to the same value
      # where tests are attested: Ruby's local time zone otherwise comes from
      # the machine.
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit must be available to read policy from

      # Attestations only match the exact Ruby version and patchlevel they
      # were made with (and the same Rails, Bundler, Minitest/RSpec, gem
      # versions, SQLite library and time zone data). Pin the version in .ruby-version
      # (or here) and attest with the same one locally. bundler-cache installs
      # the Gemfile.lock bundle into vendor/bundle (Gemfile.lock must list the
      # x86_64-linux platform: `bundle lock --add-platform x86_64-linux`).
      # Nothing attested is skipped here if the tests read the git-ignored
      # config/master.key (a generated app's Active Record does at boot; see
      # "Credentials" in vci's README) or run under a Bootsnap compile cache.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.9"
          bundler-cache: true

      # The CLI and its Ruby collector (ruby/vci-collector) come from the same
      # vci checkout; VCI_RUBY_COLLECTOR tells vci where the collector lives.
      # Pinned to a vci release (v1.0.0; for strict pinning use the full SHA from the release page): the
      # verifier must not change under you; v1 moves only to tested 1.x releases.
      - name: Install vci
        run: |
          git clone https://github.com/PandelisZ/cryptographically-verifiable-ci-runner "$RUNNER_TEMP/vci"
          git -C "$RUNNER_TEMP/vci" checkout --detach v1.0.0
          cargo install --locked --path "$RUNNER_TEMP/vci/crates/vci-cli"
          echo "VCI_RUBY_COLLECTOR=$RUNNER_TEMP/vci/ruby/vci-collector" >> "$GITHUB_ENV"

      # git-meta pull of refs/meta/main (attestations pushed with `vci push`
      # or `git meta push`) into .git/git-meta.sqlite; read access is enough.
      - name: Fetch attestations
        run: vci fetch --remote origin

      # Policy (vci.toml) and trust (.vci/allowed_signers) are read from the
      # BASE commit, so a pull request cannot add its own signer. On pushes to
      # main the base is the pushed commit itself: `vci init` lists
      # refs/heads/main in policy.no_skip_refs, so everything runs there.
      # `vci ci` runs each remaining file in its own `bin/rails test <file>`
      # or, for RSpec, `rspec --options .rspec <file>` (fresh SQLite databases
      # loaded from db/schema.rb, one process, the fixed seed attestations are
      # made with; RSpec reads .rspec only, never ~/.rspec,
      # $XDG_CONFIG_HOME/rspec/options or .rspec-local, on both sides) and
      # exits non-zero if any fails. SPEC_OPTS reaches RSpec only if declared
      # in vci.toml ([env] global), and is then compared.
      - name: Plan, then run what is not attested
        run: vci ci --base-ref "${{ github.event.pull_request.base.sha || github.sha }}" --audit-log vci-audit.json

      # To have CI attest what it runs, so that the next commit skips every
      # unit whose inputs did not change (docs/GITHUB_ACTIONS.md, "Attesting
      # in CI"; needs a vci release that has `vci ci --key`): run this job
      # only on pull requests (if: github.event_name == 'pull_request') and
      # give pushes to main a copy of it with
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   environment: vci-attest   # VCI_SIGNING_KEY exists only here
      #   permissions:
      #     contents: write         # --push writes refs/meta/main
      # whose step above becomes:
      # - name: Run what is not attested, attest it, publish it
      #   env:
      #     KEY: ${{ secrets.VCI_SIGNING_KEY }}
      #   run: |
      #     trap 'rm -f "$RUNNER_TEMP/vci-key"' EXIT
      #     (umask 077 && printf '%s\n' "$KEY" > "$RUNNER_TEMP/vci-key")
      #     vci ci --base-ref "${{ github.sha }}" --audit-log vci-audit.json \
      #       --key "$RUNNER_TEMP/vci-key" --push --remote origin

      - name: Upload the audit log of skipped tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vci-audit
          path: vci-audit.json
