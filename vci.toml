# vci configuration for this repository's demo projects.
# Policy is read from the BASE commit in CI.

[policy]
# "any" | "same-os" | "exact": which OS/arch may satisfy CI.
platform = "any"
max_ttl = "30d"
allow_dirty = true
# Pushes to the default branch and tags run everything, except units the CI
# key attested (the action's signing-key on the previous commit of main).
no_skip_refs = ["refs/heads/main", "refs/tags/**"]
no_skip_refs_except = ["github-actions"]
never_skip = []

[env]
# Only the variables named here and in vci's short built-in lists reach the
# tests; every other one is removed (docs/ENV.md; `vci env` shows the lists).
# Set by vci in every test process, here and in CI (nothing to export).
set = { TZ = "UTC", CGO_ENABLED = "0" }
# Taken from the machine and hashed: another value re-runs the test.
hash = []
# Taken from the machine, never hashed, never a reason to re-run.
ignore = []

[[projects]]
name = "py"
path = "demo/pytest-app"
adapter = "pytest"

[[projects]]
name = "go"
path = "demo/go-app"
adapter = "go"

[[projects]]
name = "rust"
path = "demo/cargo-app"
adapter = "cargo"

[[projects]]
name = "rails"
path = "demo/rails-app"
adapter = "rails"

[[projects]]
name = "rspec"
path = "demo/rspec-app"
adapter = "rails"
runner = "rspec"
