# vci configuration for this repository's demo projects.
# Policy is read from the BASE commit in CI.

[policy]
# "any" | "same-os" | "exact": which OS/arch may satisfy CI.
platform = "any"
max_ttl = "30d"
allow_dirty = true
# Pushes to the default branch and tags run everything.
no_skip_refs = ["refs/heads/main", "refs/tags/**"]
never_skip = []

[env]
# "strict": only declared and pass-through variables reach tests.
mode = "strict"
# Hashed into every test unit's inputs. Set to the same values locally and in CI.
global = ["TZ", "CGO_ENABLED"]
pass_through = []

[[projects]]
name = "py"
path = "demo/pytest-app"
adapter = "pytest"

[[projects]]
name = "go"
path = "demo/go-app"
adapter = "go"

[[projects]]
name = "rust"
path = "demo/cargo-app"
adapter = "cargo"

[[projects]]
name = "rails"
path = "demo/rails-app"
adapter = "rails"
