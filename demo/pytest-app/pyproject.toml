[project]
name = "vci-demo-app"
version = "0.1.0"
description = "vci fixture: four pytest files with different kinds of dependencies"
requires-python = ">=3.10"
dependencies = [
    "idna==3.20",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
