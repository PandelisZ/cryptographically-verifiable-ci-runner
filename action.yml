name: "vci: skip tests already attested"
description: >
  Installs the published vci release binary pinned by this action (no
  compiling), fetches attestations (git-meta metadata on refs/meta/main), and
  runs only the tests that no trusted signer has already run against identical
  inputs.
branding:
  icon: check-circle
  color: green

inputs:
  base-ref:
    description: >
      Commit that policy (vci.toml) and trust (.vci/allowed_signers) are read
      from. Must not be controlled by the pull request. Defaults to the pull
      request's base commit, or the pushed commit on push events.
    default: ${{ github.event.pull_request.base.sha || github.sha }}
  command:
    description: "`ci` (plan, then run what is left) or `plan` (decide only)."
    default: ci
  remote:
    description: >
      Where to fetch attestations (git-meta, refs/meta/main) from: a git remote
      name or URL. The default uses the checkout's own origin and credentials.
    default: origin
  audit-log:
    description: Where `vci ci` writes the JSON audit log of skipped and run tests.
    default: vci-audit.json
  working-directory:
    description: Directory inside the repository to run vci from.
    default: .
  build-from-source:
    description: >
      `true` lets the action compile vci (cargo build --release, about two
      minutes cold, needs a Rust toolchain) when no published binary fits.
      With the default `false` the action never compiles: it downloads the
      release binary recorded in its release/manifest.txt (checksum verified;
      with gh, or else curl or wget) and fails at once if this commit of the
      action is not a release (use @v1, or the commit SHA v1 points to), the
      download fails, or the runner's platform has no binary.
    default: "false"
  prebuilt:
    description: >
      Deprecated: `false` skips the download and compiles vci, the same as
      build-from-source `true` without trying the release binary first.
    default: "true"
  token:
    description: Token `gh` uses to download the release binary (needs read access to the action's releases); without gh, or when gh fails, the public release URL is used.
    default: ${{ github.token }}
  signing-key:
    description: >
      Contents of an SSH private key (e.g. `secrets.VCI_SIGNING_KEY`). When
      set, `vci ci` runs what is not attested the way `vci run` does and signs
      an attestation for every unit that passed (on a run-everything ref such
      as main, every unit), so the next commit's CI skips each unit whose
      inputs did not change. The key's public half must be in
      .vci/allowed_signers on the base branch, and for main-branch runs to be
      reused on main its principal must be listed in
      policy.no_skip_refs_except. Never printed, but every process of the
      job (tests, their dependencies, other steps) can read it: pass it only
      from a GitHub Environment restricted to the default branch, never to
      pull_request runs (see "Attesting in CI" in docs/GITHUB_ACTIONS.md).
      With a principal in no_skip_refs_except, vci ci attests nothing on a
      ref that policy.no_skip_refs does not match.
    default: ""
  ttl:
    description: Lifetime of the attestations made with signing-key (at most policy.max_ttl).
    default: 14d
  push:
    description: >
      With signing-key: publish the attestations afterwards (`vci ci --push`,
      git-meta pushes refs/meta/main to `remote` with the checkout's
      credentials, so the job needs `permissions: contents: write`). A failed
      push is a warning and never fails the job.
    default: "true"

outputs:
  skipped:
    description: Number of test units skipped.
    value: ${{ steps.plan.outputs.skipped }}
  run:
    description: Number of test units that had to run.
    value: ${{ steps.plan.outputs.run }}
  attested:
    description: Number of test units attested with signing-key (0 without it).
    value: ${{ steps.ci.outputs.attested }}

runs:
  using: composite
  steps:
    # The published release binary built from exactly these sources, checksum
    # verified against release/manifest.txt (part of the pinned action, so the
    # release cannot change what is trusted). Never compiles: when no published
    # binary fits it fails right here, before any toolchain or cache work,
    # unless build-from-source is true; then it outputs build=true and the
    # steps below compile vci. See scripts/action-binary.sh.
    - name: Install the vci release binary
      id: binary
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BUILD_FROM_SOURCE: ${{ inputs.build-from-source }}
        PREBUILT: ${{ inputs.prebuilt }}
        ACTION_REPOSITORY: ${{ github.action_repository || github.repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-binary.sh"

    # Only with build-from-source: true (or the deprecated prebuilt: false),
    # e.g. the vci repository's own CI. A binary already built from these
    # sources is reused; otherwise cargo builds with its registry and the
    # dependencies' build artifacts restored from a cache keyed on the action's
    # Cargo.lock and the rustc version (computed here: hashFiles() only reads
    # the workspace, not the action's directory), so only vci's own crates
    # compile.
    - name: Restore a vci binary built from these sources
      id: bin-cache
      if: steps.binary.outputs.build == 'true' && (inputs.build-from-source == 'true' || inputs.prebuilt == 'false')
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/vci-bin
        key: vci-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary.outputs.source }}

    - name: Key the cargo cache
      id: cargo-key
      if: steps.binary.outputs.build == 'true' && (inputs.build-from-source == 'true' || inputs.prebuilt == 'false') && steps.bin-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if ! command -v cargo >/dev/null 2>&1; then
          echo "::error title=vci::build-from-source needs a Rust toolchain (cargo) on the PATH, e.g. dtolnay/rust-toolchain before this action"
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then sum="sha256sum"; else sum="shasum -a 256"; fi
        lock=$($sum < Cargo.lock | cut -c1-32)
        rustc=$(rustc -vV | $sum | cut -c1-16)
        prefix="vci-cargo-$RUNNER_OS-$RUNNER_ARCH-$rustc-"
        {
          echo "home=${CARGO_HOME:-$HOME/.cargo}"
          echo "prefix=$prefix"
          echo "key=$prefix$lock"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the cargo cache
      id: cargo-cache
      if: steps.binary.outputs.build == 'true' && (inputs.build-from-source == 'true' || inputs.prebuilt == 'false') && steps.bin-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.cargo-key.outputs.home }}/registry/index
          ${{ steps.cargo-key.outputs.home }}/registry/cache
          ${{ steps.cargo-key.outputs.home }}/git/db
          ${{ runner.temp }}/vci-target
        key: ${{ steps.cargo-key.outputs.key }}
        restore-keys: ${{ steps.cargo-key.outputs.prefix }}

    - name: Build vci from source
      if: steps.binary.outputs.build == 'true' && (inputs.build-from-source == 'true' || inputs.prebuilt == 'false') && steps.bin-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/vci-target
      run: |
        cargo build --release --locked -p vci-cli
        cp "$CARGO_TARGET_DIR/release/vci" "$RUNNER_TEMP/vci-bin/vci"

    # Saved right after the build (not at the end of the job), so a later
    # failing test does not throw the build away.
    - name: Save the cargo cache
      if: steps.binary.outputs.build == 'true' && (inputs.build-from-source == 'true' || inputs.prebuilt == 'false') && steps.bin-cache.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.cargo-key.outputs.home }}/registry/index
          ${{ steps.cargo-key.outputs.home }}/registry/cache
          ${{ steps.cargo-key.outputs.home }}/git/db
          ${{ runner.temp }}/vci-target
        key: ${{ steps.cargo-key.outputs.key }}

    - name: Save the vci binary built from these sources
      if: steps.binary.outputs.build == 'true' && (inputs.build-from-source == 'true' || inputs.prebuilt == 'false') && steps.bin-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/vci-bin
        key: vci-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary.outputs.source }}

    - name: Put vci and its collectors on the path
      shell: bash
      run: |
        echo "$RUNNER_TEMP/vci-bin" >> "$GITHUB_PATH"
        echo "VCI_PY_PLUGIN=${{ github.action_path }}/py/pytest-plugin" >> "$GITHUB_ENV"
        echo "VCI_JS_PLUGIN=${{ github.action_path }}/js/vitest-plugin" >> "$GITHUB_ENV"
        echo "VCI_RUBY_COLLECTOR=${{ github.action_path }}/ruby/vci-collector" >> "$GITHUB_ENV"

    # git-meta pull: configures a git-meta remote (`meta`) with the remote's
    # URL, fetches refs/meta/main into refs/meta/remotes/main and materializes
    # it into .git/git-meta.sqlite. Needs read access only. If it fails, no
    # attestation is available and everything runs (fail open).
    - name: Fetch attestations
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REMOTE: ${{ inputs.remote }}
      run: |
        if ! vci fetch --remote "$REMOTE"; then
          echo "::warning title=vci::could not fetch attestations from $REMOTE; every test will run"
        fi

    - name: Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE: ${{ inputs.base-ref }}
      run: |
        vci plan --base-ref "$BASE" --format text | tee "$RUNNER_TEMP/vci-plan.txt"
        echo "skipped=$(grep -c '^SKIP ' "$RUNNER_TEMP/vci-plan.txt" || true)" >> "$GITHUB_OUTPUT"
        echo "run=$(grep -c '^RUN ' "$RUNNER_TEMP/vci-plan.txt" || true)" >> "$GITHUB_OUTPUT"
        {
          echo '### vci plan'
          echo '```'
          cat "$RUNNER_TEMP/vci-plan.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # With signing-key: the key goes to a file only this user can read
    # (ssh-keygen refuses others), with a trailing newline (a secret pasted
    # without one is not a valid key file).
    - name: Install the signing key
      if: inputs.command == 'ci' && inputs.signing-key != ''
      shell: bash
      env:
        KEY: ${{ inputs.signing-key }}
      run: |
        umask 077
        printf '%s\n' "$KEY" > "$RUNNER_TEMP/vci-key"
        chmod 600 "$RUNNER_TEMP/vci-key"

    - name: Run what is not attested
      id: ci
      if: inputs.command == 'ci'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE: ${{ inputs.base-ref }}
        AUDIT: ${{ inputs.audit-log }}
        SIGN: ${{ inputs.signing-key != '' }}
        TTL: ${{ inputs.ttl }}
        PUSH: ${{ inputs.push }}
        REMOTE: ${{ inputs.remote }}
      run: |
        args=(--base-ref "$BASE" --audit-log "$AUDIT")
        if [ "$SIGN" = "true" ]; then
          args+=(--key "$RUNNER_TEMP/vci-key" --ttl "$TTL")
          if [ "$PUSH" = "true" ]; then
            args+=(--push --remote "$REMOTE")
          fi
        fi
        set +e
        vci ci "${args[@]}"
        code=$?
        set -e
        attested=$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1])).get("attested") or []))' "$AUDIT" 2>/dev/null || echo 0)
        echo "attested=$attested" >> "$GITHUB_OUTPUT"
        exit "$code"

    - name: Remove the signing key
      if: always() && inputs.signing-key != ''
      shell: bash
      run: rm -f "$RUNNER_TEMP/vci-key"
